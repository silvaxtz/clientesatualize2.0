<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Atualize Telecom</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

<script src="https://unpkg.com/lucide@latest"></script>

</head>

<body>

<div class="app">

<header class="topbar">

<div class="brand">

<img src="assets/logo.svg" alt="Atualize">

<div>

<h1>Atualize</h1>

<span>Pesquisa de Clientes</span>

</div>

</div>

<button class="menu-btn">

<i data-lucide="menu"></i>

</button>

</header>

<main>

<section class="search-card">

<h2>Pesquisar Cliente</h2>

<p>

Pesquise por PPOE, IP ou SSID

</p>

<div class="search">

<i data-lucide="search"></i>

<input
type="text"
placeholder="Digite aqui...">

<button>

Buscar

</button>

</div>

</section>

<section class="history">

<h3>Últimas pesquisas</h3>

<div class="chips">

<button>Cliente 1</button>

<button>Cliente 2</button>

<button>Cliente 3</button>

</div>

</section>

<section class="result">

<div class="empty">

<i data-lucide="search-x"></i>

<h3>Nenhuma pesquisa</h3>

<p>

Digite um PPOE ou IP para iniciar.

</p>

</div>

</section>

</main>

</div>

<script>

lucide.createIcons();

</script>

</body>

</html>
