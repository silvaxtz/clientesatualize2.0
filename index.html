<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Atualize Telecom</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<script src="https://unpkg.com/lucide@latest"></script>

</head>

<body>

<div class="overlay"></div>

<aside class="sidebar">

    <div class="sidebar-header">

        <img src="assets/logo.svg" alt="Atualize">

        <div>

            <h2>Atualize</h2>

            <span>Telecom</span>

        </div>

    </div>

    <nav>

        <a href="#" class="active">

            <i data-lucide="house"></i>

            Início

        </a>

        <a href="#">

            <i data-lucide="search"></i>

            Pesquisa

        </a>

        <a href="#">

            <i data-lucide="layout-dashboard"></i>

            Dashboard

        </a>

        <a href="#">

            <i data-lucide="file-up"></i>

            Importar Excel

        </a>

        <a href="#">

            <i data-lucide="download"></i>

            Exportar JSON

        </a>

        <a href="#">

            <i data-lucide="settings"></i>

            Configurações

        </a>

        <a href="#" class="logout">

            <i data-lucide="log-out"></i>

            Sair

        </a>

    </nav>

</aside>

<div class="app">

<header class="topbar">

<div class="brand">

<img src="assets/logo.svg" alt="Atualize">

<div>

<h1>Atualize</h1>

<span>Pesquisa de Clientes</span>

</div>

</div>

<button class="menu-btn" id="menuBtn">

<i data-lucide="menu"></i>

</button>

</header>

<main>

<section class="search-card">

<h2>Pesquisar Cliente</h2>

<p>

Pesquise por PPOE, IP ou SSID

</p>

<div class="search">

<i data-lucide="search"></i>

<input
type="text"
placeholder="Digite aqui...">

<button>

Buscar

</button>

</div>

</section>

<section class="history">

<h3>Últimas pesquisas</h3>

<div class="chips">

<button>Cliente 1</button>

<button>Cliente 2</button>

<button>Cliente 3</button>

</div>

</section>

<section class="result">

    <div class="result-header">

        <h3>Resultado</h3>

        <span class="status online">

            Online

        </span>

    </div>

    <div class="info-grid">

        <div class="info-card">

            <i data-lucide="user"></i>

            <small>Cliente</small>

            <strong>----------</strong>

        </div>

        <div class="info-card">

            <i data-lucide="network"></i>

            <small>IP</small>

            <strong>----------</strong>

        </div>

        <div class="info-card">

            <i data-lucide="router"></i>

            <small>Painel</small>

            <strong>----------</strong>

        </div>

        <div class="info-card">

            <i data-lucide="wifi"></i>

            <small>Sinal</small>

            <strong>----------</strong>

        </div>

    </div>

    <div class="actions">

        <button class="btn secondary">

            <i data-lucide="copy"></i>

            Copiar IP

        </button>

        <button class="btn secondary">

            <i data-lucide="copy"></i>

            Copiar PPOE

        </button>

        <button class="btn secondary">

            <i data-lucide="copy"></i>

            Copiar SSID

        </button>

    </div>

</section>

</main>

</div>

<script>

lucide.createIcons();

</script>
    
<script src="
    app.js"></script>
    
</body>

</html>
